<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff751f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#111111"/>
  <rect width="800" height="480" fill="url(#glow)"/>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Card 3 — back -->
  <rect x="208" y="290" width="384" height="72" rx="14" fill="#1e1e1e" filter="url(#shadow)"/>
  <rect x="208" y="290" width="384" height="72" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <rect x="216" y="306" width="36" height="36" rx="9" fill="#ff751f" fill-opacity="0.15"/>
  <circle cx="234" cy="324" r="9.5" fill="none" stroke="#ff751f" stroke-width="1.8"/>
  <circle cx="234" cy="324" r="6" fill="none" stroke="#ff751f" stroke-width="1.5"/>
  <text x="234" y="328.5" font-family="system-ui,sans-serif" font-size="8.5" font-weight="800" fill="#ff751f" text-anchor="middle">1</text>
  <text x="263" y="320" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.45">Taskr  ·  5m ago</text>
  <text x="263" y="338" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.35">Due in 24h: Lab Report — CHEM 101</text>

  <!-- Card 2 — middle -->
  <rect x="196" y="196" width="408" height="72" rx="14" fill="#242424" filter="url(#shadow)"/>
  <rect x="196" y="196" width="408" height="72" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="206" y="212" width="36" height="36" rx="9" fill="#ff751f" fill-opacity="0.15"/>
  <circle cx="224" cy="230" r="9.5" fill="none" stroke="#ff751f" stroke-width="1.8"/>
  <circle cx="224" cy="230" r="6" fill="none" stroke="#ff751f" stroke-width="1.5"/>
  <text x="224" y="234.5" font-family="system-ui,sans-serif" font-size="8.5" font-weight="800" fill="#ff751f" text-anchor="middle">1</text>
  <text x="252" y="226" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.55">Taskr  ·  2m ago</text>
  <text x="252" y="244" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.45">Due in 24h: Problem Set 4 — Math 201</text>

  <!-- Card 1 — front -->
  <rect x="184" y="100" width="432" height="80" rx="16" fill="#2a2a2a" filter="url(#shadow)"/>
  <rect x="184" y="100" width="432" height="80" rx="16" fill="none" stroke="#ff751f" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="184" y="114" width="3.5" height="52" rx="2" fill="#ff751f" fill-opacity="0.85"/>
  <!-- Icon -->
  <rect x="202" y="114" width="42" height="42" rx="11" fill="#ff751f" fill-opacity="0.14"/>
  <circle cx="223" cy="135" r="12" fill="none" stroke="#ff751f" stroke-width="2"/>
  <circle cx="223" cy="135" r="7.5" fill="none" stroke="#ff751f" stroke-width="1.8"/>
  <text x="223" y="140" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#ff751f" text-anchor="middle">1</text>
  <!-- App name -->
  <text x="255" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.9">Taskr</text>
  <!-- Timestamp -->
  <text x="598" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.4" text-anchor="end">now</text>
  <!-- Body -->
  <text x="255" y="146" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#ffffff">Due in 24h: Research Paper</text>
  <text x="255" y="165" font-family="system-ui,sans-serif" font-size="12" fill="#ff751f" fill-opacity="0.85">UVEC Eng  ·  Tomorrow, 11:59 PM</text>

  <!-- Wordmark bottom-right -->
  <circle cx="660" cy="400" r="16" fill="none" stroke="#ff751f" stroke-width="2.2" stroke-opacity="0.65"/>
  <circle cx="660" cy="400" r="10" fill="none" stroke="#ff751f" stroke-width="1.8" stroke-opacity="0.65"/>
  <text x="660" y="405" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#ff751f" fill-opacity="0.75" text-anchor="middle">1</text>
  <text x="682" y="406" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#ffffff" fill-opacity="0.45">Taskr</text>

  <!-- Label -->
  <text x="400" y="448" font-family="system-ui,sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.2" text-anchor="middle" letter-spacing="0.14em">DEADLINE REMINDERS</text>
</svg>
