<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <radialGradient id="g" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#ff751f" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gr" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0L0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
  </pattern>
  <!-- QR finder pattern clip -->
  <clipPath id="qr-clip"><rect x="286" y="152" width="140" height="140" rx="6"/></clipPath>
</defs>
<rect width="800" height="480" fill="#111111"/>
<rect width="800" height="480" fill="url(#g)"/>
<rect width="800" height="480" fill="url(#gr)"/>

<!-- Center the content in 800px, using x=200 to x=600 as the main panel -->

<!-- Header -->
<text x="200" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ffffff">Tappers</text>
<text x="200" y="62" font-family="system-ui,sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.38">Invite a classmate to link accounts. Shared tasks live in the Shared Tasks tab.</text>

<!-- Tab bar -->
<rect x="200" y="76" width="400" height="34" rx="8" fill="#1e1e1e"/>
